
services:
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0 
    volumes:
      - shared:/data
      - ./web:/app
      - ./shared:/app/shared
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    volumes:
      - shared:/data
      - kraken_db:/human_viral_db
    deploy:
      replicas: 1
    cpus: 8

volumes:
  shared:
  kraken_db:


services:
  web:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1 
    volumes:
      - shared:/data
      - ./web:/app
    depends_on:
      - worker

  worker:
    build: ./worker
    volumes:
      - shared:/data
      - kraken_db:/human_viral_db
    deploy:
      replicas: 1

volumes:
  shared:
  kraken_db:
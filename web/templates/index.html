<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASTQ Analysis Pipeline</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="/">Pipeline</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/how-to">Usage Instructions</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>FASTQ Analysis Pipeline</h1>
        <p class="meta">Course: BIN Toolbox | Team: Jesse & Robin</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="section">
                <h2>Input Files</h2>
                <label>
                    Upload FASTQ file
                    <input type="file" name="fastq-file" accept=".fastq,.fq,.fastq.gz,.fq.gz">
                </label>
            </div>
            <div class="section">
                <h2>fastp Configuration</h2>
                <div class="config-group">
                    <label>
                        Quality threshold
                        <input type="number" name="fastp-q" value="15" min="0" max="40">
                    </label>

                    <label>
                        Minimum length
                        <input type="number" name="fastp-l" value="60" min="1">
                    </label>

                    <label>
                        Threads
                        <input type="number" name="fastp-thread" value="4" min="1">
                    </label>

                    <label>
                        Trim adapters
                        <select name="fastp-adapter">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="section">
                <h2>Kraken2 Configuration</h2>
                <div class="config-group">
                    <label>
                        Database
                        <select name="kraken-db">
                            <option value="standard">Standard</option>
                            <option value="standard-8gb">Standard-8GB</option>
                            <option value="viral">Viral</option>
                        </select>
                    </label>

                    <label>
                        Confidence threshold
                        <input type="number" name="kraken-confidence" value="0.0" min="0" max="1" step="0.01">
                    </label>

                    <label>
                        Threads
                        <input type="number" name="kraken-thread" value="4" min="1">
                    </label>
                </div>
            </div>

            <div class="section">
                <button type="submit">Run analysis</button>
            </div>

            <div class="section results-placeholder">
                <h2>Results</h2>
                <p>The output report and Krona chart will appear here after submission.</p>
            </div>
        </form>
    </div>
</body>
</html>
